name: medimind
description: MediMind Patient Mobile App — Your Health, Simplified.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  bloc_concurrency: ^0.3.0
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^10.0.0
  get_it: ^9.1.1
  dio: ^5.7.0
  dartz: ^0.10.1
  shared_preferences: ^2.3.2
  device_info_plus: ^12.3.0
  equatable: ^2.0.7
  easy_localization: ^3.0.7
  easy_localization_loader: ^2.0.2
  page_transition: ^2.2.1
  image_picker: ^1.1.2
  file_picker: ^10.0.0
  connectivity_plus: ^6.1.3
  internet_connection_checker_plus: ^2.7.1
  persistent_bottom_nav_bar_v2: ^6.1.0
  permission_handler: ^12.0.0+1
  flutter_colorpicker: ^1.1.0
  mobile_scanner: ^7.0.0
  pinput: ^6.0.1
  smart_auth: ^3.2.0
  root_checker_plus: ^1.0.0
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  font_awesome_flutter: ^10.10.0
  chapasdk: ^0.0.8+1
  url_launcher: ^6.3.2
  flutter_markdown_plus: ^1.0.5
  firebase_core: ^4.2.1
  firebase_remote_config: ^6.4.0
  firebase_messaging: ^16.2.0
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.3.0
  package_info_plus: ^8.1.1
  toastification: ^3.0.3
  pretty_dio_logger: ^1.4.0
  in_app_update: ^4.2.5
  fl_chart: ^0.70.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^14.6.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  signalr_netcore: ^1.3.8
  agora_rtc_engine: ^6.5.0
  agora_rtm: ^2.1.0
  cached_network_image: ^3.4.1
  phone_numbers_parser: ^9.0.3
  flutter_svg: ^2.0.14
  table_calendar: ^3.1.3
  syncfusion_flutter_pdfviewer: ^31.1.39
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/translations/
    - assets/certs/
    - .env

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0D9488"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 23
  web:
    generate: false

flutter_native_splash:
  color: "#0D9488"
  color_dark: "#0F172A"
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png
  android: true
  ios: true
  android_12:
    color: "#0D9488"
    color_dark: "#0F172A"
    image: assets/images/splash_logo.png
    image_dark: assets/images/splash_logo.png
    icon_background_color: "#0D9488"
    icon_background_color_dark: "#0F172A"
